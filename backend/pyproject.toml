[project]
name = "digital-clone-backend"
version = "0.1.0"
description = "个人日程系统后端（单用户、免登录 MVP）"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "pydantic-settings>=2.12",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.39",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
